name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  production-container:
    name: Production container and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_DOMAIN: kithwork-ci.example.invalid
      APP_DB_NAME: kithwork_ci
      BOOTSTRAP_DB_PASSWORD: ci-only-bootstrap-placeholder
      MIGRATOR_DB_PASSWORD: ci-only-migrator-placeholder
      APP_DB_PASSWORD: ci-only-runtime-placeholder
      BETTER_AUTH_SECRET: ci-only-auth-placeholder-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose -f compose.production.yaml config --quiet

      - name: Build production web image
        run: docker build --tag kithwork-web:ci ./apps/web
